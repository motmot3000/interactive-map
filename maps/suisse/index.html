THESIS: la carte est l'interface. Une planche de relevé qu'on survole, zoome et parcourt de région en région ; refuse la carte encadrée sous un bandeau de quiz.
OWN-WORLD: champ d'eau bleu lac plein cadre, terres blanc carte, frontières fines, voisins gris relevé, écritures de cartographe (mers en italique, codes en mono) ; calques blancs à ombre unique ; encre pour l'action ; vert, pointillé ambre et hachure vermillon pour corriger.
STORY: on navigue, on ouvre la fiche d'une région, on saute à ses voisins, puis on se teste et la carte corrige chaque erreur.
FIRST VIEWPORT: carte plein cadre ; barre fine (retour, titre, Explorer/Quiz, son, plein écran) ; fiche à droite ; zoom en bas à droite ; mini-carte en bas à gauche dès qu'on zoome.
FORM: carte nationale suisse et son géoportail (swisstopo), 3e de 7 ; seed 734cc3ef.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
