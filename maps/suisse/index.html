<!--
THESIS: la carte est le terrain de jeu : un atlas d'école plein écran, sous la bande de carte ancienne de Thomas ; refuse la carte encadrée et la console grise.
OWN-WORLD: bande « carte ancienne » à liseré doré, titre en écriture ; atlas politique pastel à frontières blanches pour explorer, carte muette parchemin pour le quiz ; mer bleu clair et graticule, voisins parchemin ; fiche sur papier crème et carte pixelisée ; encre marine, laiton doré, étoiles.
STORY: on explore et l'on ouvre la fiche d'une région, on saute à ses voisins, puis on relève le défi sur la carte muette : chaque erreur est corrigée sur la carte et le bilan donne des étoiles.
FIRST VIEWPORT: bande en haut (accueil rond, titre en écriture, Explorer/Quiz, son, plein écran) ; carte plein écran ; fiche à droite (en bas sur téléphone) ; zoom en bas à droite ; rose des vents en haut à gauche ; échelle en bas à gauche.
FORM: monde épinglé par Thomas le 2026-11-24 (sa v1) ; pas de tirage, le précédent (734cc3ef) est abandonné.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
